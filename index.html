<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="display:flex ;">

    <div style="width: 50%;">
        <canvas style="width: 50%;" id="linha"></canvas>
    </div>
    <div style="width: 50%;">
        <canvas style="width: 50%;" id="barra"></canvas>
    </div>


</body>

</html>
<script>
    const linhas = document.getElementById('linha');
    const barras = document.getElementById('barra');
    new Chart(linhas, {
        type: 'line',
        data: {
            labels: ['12:00','13:00','14:00','15:00','16:00','17:00'],
            datasets: [{
                label: 'Temperatura',
                data: [30, 29, 28, 25, 22, 23],
                borderColor:'rgba(255, 177, 193)',
                backgroundColor:'rgba(255, 177, 193)',
                borderWidth: 1
            },
            {
                label:'Umidade',
                data:[80, 82, 80, 85, 80, 83],
                borderColor:'rgba(154, 208, 245)',
                backgroundColor:'rgba(154, 208, 245)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

     new Chart(barras, {
        type: 'bar',
        data: {
            labels: ['Janeiro','Fevereiro','Março','Abril','Maio','Junho'],
            datasets: [{
                label: 'Temperatura Média',
                data: [22,24,27,23,20,18],
                borderColor:'rgba(255, 177, 193)',
                backgroundColor:'rgba(255, 177, 193)',
                borderWidth: 1
            },
            {
                label:'Umidade Média',
                data:[90,89,93,87,88,82],
                borderColor:'rgba(154, 208, 245)',
                backgroundColor:'rgba(154, 208, 245)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
